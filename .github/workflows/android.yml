name: Gerar APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Garantir www/index.html (minúsculo)
        shell: bash
        run: |
          # O Linux diferencia index.html de Index.html. O Capacitor exige www/index.html.
          # Prioridade: www/index.html > index.html da raiz > www/Index.html
          if [ -f www/index.html ]; then
            echo "Usando www/index.html"
          elif [ -f index.html ]; then
            echo "Usando index.html da raiz (copiando para www/index.html)"
            mkdir -p www && cp index.html www/index.html
          elif [ -f www/Index.html ]; then
            echo "Usando www/Index.html (renomeando para index.html)"
            mv www/Index.html www/index.html
          else
            echo "::error::Nenhum index.html encontrado. Suba o jogo em www/index.html"
            exit 1
          fi
          grep -o '<title>[^<]*' www/index.html || true
          ls -la www
      - name: Verificar se www/index.html não está corrompido
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          d = open('www/index.html','rb').read()
          if b'\x00' in d or b'<!doctype' not in d[:3000].lower():
              print('::error::www/index.html está corrompido (bytes nulos ou sem <!DOCTYPE>). Restaure uma versão boa do histórico.')
              sys.exit(1)
          print('index.html OK,', len(d), 'bytes')
          PY
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Permitir vibração
        run: grep -q 'android.permission.VIBRATE' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Forçar modo paisagem
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Compilar
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ELYNDRA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ELYNDRA-apk
          path: ELYNDRA.apk
      - name: Anexar à Release (só em tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ELYNDRA.apk

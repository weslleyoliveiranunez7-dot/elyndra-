name: Gerar APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Forçar modo paisagem
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - name: Compilar
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ELYNDRA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ELYNDRA-apk
          path: ELYNDRA.apk
      - name: Anexar à Release (só em tag vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ELYNDRA.apk
